name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请描述你的需求与期望的方案。
  - type: textarea
    id: problem
    attributes:
      label: 你的需求 / 遇到的问题
      description: 这个功能要解决什么痛点？如果没有对应问题，也请说明使用场景。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议的方案
      description: 你期望如何解决这个问题？如有参考实现或竞品，请附上。
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 其他补充
      description: 任何额外的上下文、截图或备注。
