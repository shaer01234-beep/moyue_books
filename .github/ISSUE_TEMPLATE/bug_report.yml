name: Bug 报告
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量完整地填写以下信息，以便我们快速定位问题。
  - type: textarea
    id: desc
    attributes:
      label: 问题描述
      description: 清晰简洁地描述你遇到的问题。
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 一步步说明如何复现该问题。
      placeholder: |
        1. 进入 '...'
        2. 点击 '...'
        3. 看到错误
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？（如有报错请贴出）
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      options:
        - 单二进制（./build.sh 或直接运行 moyue-server）
        - 飞牛 fnOS（.fpk）
        - 开发模式（前端 dev + 后端）
        - 其他 / 不确定
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / Commit
      description: 例如 v1.0.2 或 commit hash
      placeholder: "v1.0.2"
  - type: textarea
    id: env
    attributes:
      label: 环境信息
      description: 操作系统、Go / Node 版本、浏览器等
      placeholder: |
        - OS: macOS / Windows / Linux / fnOS
        - Go: 1.25
        - Node: 18
        - 浏览器: Chrome 120
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 相关错误日志（`backend/data/logs/` 或终端输出）与截图，可拖拽到此处。
